# Example run config for TFT
# Usage: make train RUN=configs/runs/tft_example.yaml

model: tft

dataset: pipeline-min10100-comp0.4-out=9vars-exclude-year-apply-base-year-interp-targets-scale-impute-2026-09-03

cuda_visible_devices:
  default: "0,1,2,3,4,5,6,7"
  search: "0,1,2,3,4,5,6,7"
  train: "0,1,2,3,4,5,6,7"

# TFT-specific: enable two-window prediction mode
# (affects test phase only)
two_window: true

# TFT target normalizer:
#   "encoder_floored" (default) — per-sample μ/σ from encoder window, with scale floor
#   "global" — single global μ/σ per target from all training data
target_normalizer_mode: global

# Splitting one search across machines.  Every machine derives the same 50
# configurations from the same seed, so a slice can be named rather than
# handed out: set a different index on each, with count = number of machines.
# Omit the key to run the whole search here.
#
#   search_shard: "0/3"          # or {index: 0, count: 3}
#
# Stage 1 slices the sampled list; stage 2 slices the ranked shortlist and is
# only correct once every machine's search/trials.jsonl has been pooled with
#   python scripts/merge_search_ledgers.py --model tft --out <run>/search/trials.jsonl *.jsonl
# Overlap wastes GPU time but never corrupts a result: trials are identified
# by their parameters, so duplicates collapse on merge.

# Omit 'search' to skip hyperparameter search and use defaults instead.
phases: [preprocess, search, train, test, plot]

# To resume an existing run, set run_id and resume (overrides 'phases'):
run_id: tft_01        # existing run ID under results/tft/
resume: search         # phase to resume from (preprocess, search, train, test, plot)
